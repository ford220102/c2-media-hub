<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C2 Media Hub</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a09;color:#fff;font-family:Arial,sans-serif;padding:5vh 5vw;display:flex;flex-direction:column}header{border-bottom:1px solid #394039;padding-bottom:3vh}h1{font-size:6vh;margin:0}.sub{color:#8fb997;letter-spacing:.15em;font-weight:bold}.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3vw;padding:5vh 0}.tile{border:2px solid #394039;border-radius:28px;background:#171b18;color:#fff;text-align:left;padding:5vw;font-size:5vh;font-weight:bold}.tile small{display:block;font-size:2.2vh;color:#aaa;margin-top:2vh}.tile:focus,.set:focus,.dialog button:focus,.dialog input:focus{outline:6px solid #fff}.j{background:linear-gradient(145deg,#3a1d62,#17101e)}.x{background:linear-gradient(145deg,#17451e,#101b12)}footer{display:flex;justify-content:space-between;color:#aaa}button{cursor:pointer}.set{background:none;color:#bbb;border:1px solid #555;border-radius:20px;padding:1vh 2vw}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center}.overlay.open{display:flex}.dialog{width:min(760px,90vw);background:#171b18;border:2px solid #555;border-radius:28px;padding:5vh}.dialog h2{font-size:4vh;margin-top:0}.dialog input{width:100%;font-size:2.5vh;padding:2vh;background:#080a09;color:#fff;border:2px solid #666;border-radius:14px}.actions{display:flex;justify-content:flex-end;gap:2vw;margin-top:3vh}.actions button{font-size:2.2vh;padding:1.5vh 3vw;border-radius:20px;border:1px solid #777}.save{background:#fff;color:#111}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="sub">HISENSE C2 · VIDAA</div><h1>C2 Media Hub</h1></header><main class="grid"><button id="j" class="tile j">Jellyfin<small>Filmy i seriale →</small></button><button id="x" class="tile x">Xbox Cloud<small>Graj online →</small></button></main><footer><button id="s" class="set">Ustaw adres Jellyfin</button><span>Strzałki · OK</span></footer>
<div id="o" class="overlay"><div class="dialog"><h2>Adres serwera Jellyfin</h2><p>Przykład: 192.168.1.20:8096</p><input id="u" inputmode="url" autocomplete="off"><div class="actions"><button id="c">Anuluj</button><button id="v" class="save">Zapisz</button></div></div></div>
<script>
var key="c2-jellyfin-url",o=document.getElementById("o"),u=document.getElementById("u"),j=document.getElementById("j");function show(){u.value=localStorage.getItem(key)||"";o.className="overlay open";setTimeout(function(){u.focus()},0)}function close(){o.className="overlay";j.focus()}function save(){var v=u.value.trim();if(v&&!/^https?:\/\//i.test(v))v="http://"+v;if(v){localStorage.setItem(key,v);close()}}j.onclick=function(){var v=localStorage.getItem(key);if(v)location.href=v;else show()};document.getElementById("x").onclick=function(){location.href="https://www.xbox.com/play"};document.getElementById("s").onclick=show;document.getElementById("c").onclick=close;document.getElementById("v").onclick=save;j.focus();
</script></body></html>
