<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C2 Media Hub</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a09;color:#fff;font-family:Arial,sans-serif;padding:5vh 5vw;display:flex;flex-direction:column}header{border-bottom:1px solid #394039;padding-bottom:3vh}h1{font-size:6vh;margin:0}.sub{color:#8fb997;letter-spacing:.15em;font-weight:bold}.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3vw;padding:5vh 0}.tile{border:2px solid #394039;border-radius:28px;background:#171b18;color:#fff;text-align:left;padding:5vw;font-size:5vh;font-weight:bold}.tile small{display:block;font-size:2.2vh;color:#aaa;margin-top:2vh}.tile:focus{outline:6px solid #fff}.j{background:linear-gradient(145deg,#3a1d62,#17101e)}.x{background:linear-gradient(145deg,#17451e,#101b12)}footer{display:flex;justify-content:space-between;color:#aaa}button{cursor:pointer}.set{background:none;color:#bbb;border:1px solid #555;border-radius:20px;padding:1vh 2vw}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="sub">HISENSE C2 · VIDAA</div><h1>C2 Media Hub</h1></header>
<main class="grid"><button id="j" class="tile j">Jellyfin<small>Filmy i seriale →</small></button><button id="x" class="tile x">Xbox Cloud<small>Graj online →</small></button></main>
<footer><button id="s" class="set">Ustaw adres Jellyfin</button><span>Strzałki · OK</span></footer>
<script>
const key="c2-jellyfin-url";function setJ(){let old=localStorage.getItem(key)||"";let v=prompt("Adres Jellyfin, np. 192.168.1.20:8096",old);if(v!==null){v=v.trim();if(v&&!/^https?:\/\//i.test(v))v="http://"+v;if(v)localStorage.setItem(key,v)}}document.getElementById("j").onclick=()=>{let u=localStorage.getItem(key);if(!u){setJ();u=localStorage.getItem(key)}if(u)location.href=u};document.getElementById("x").onclick=()=>location.href="https://www.xbox.com/play";document.getElementById("s").onclick=setJ;document.getElementById("j").focus();
</script></body></html>
