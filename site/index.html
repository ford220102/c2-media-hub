<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C2 Media Hub</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a09;color:#fff;font-family:Arial,sans-serif;padding:5vh 5vw;display:flex;flex-direction:column}header{border-bottom:1px solid #394039;padding-bottom:3vh}h1{font-size:6vh;margin:0}.sub{color:#8fb997;letter-spacing:.15em;font-weight:bold}.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3vw;padding:5vh 0}.tile{border:2px solid #394039;border-radius:28px;background:#171b18;color:#fff;text-align:left;padding:5vw;font-size:5vh;font-weight:bold}.tile small{display:block;font-size:2.2vh;color:#aaa;margin-top:2vh}.tile:focus,.set:focus,.dialog button:focus,.dialog input:focus{outline:6px solid #fff}.j{background:linear-gradient(145deg,#3a1d62,#17101e)}.x{background:linear-gradient(145deg,#17451e,#101b12)}footer{display:flex;justify-content:space-between;align-items:center;color:#aaa}.footBtns{display:flex;gap:1vw}button{cursor:pointer}.set{background:none;color:#ddd;border:1px solid #555;border-radius:20px;padding:1.2vh 2vw}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:3vh}.overlay.open{display:flex}.dialog{width:min(780px,92vw);background:#171b18;border:2px solid #555;border-radius:28px;padding:5vh}.dialog h2{font-size:4vh;margin-top:0}.dialog input{width:100%;font-size:2.5vh;padding:2vh;background:#080a09;color:#fff;border:2px solid #666;border-radius:14px}.actions{display:flex;justify-content:flex-end;gap:2vw;margin-top:3vh}.actions button{font-size:2.2vh;padding:1.5vh 3vw;border-radius:20px;border:1px solid #777}.save{background:#fff;color:#111}.result{background:#0d100e;border:1px solid #485048;border-radius:18px;padding:2.5vh;margin:2vh 0;min-height:12vh;line-height:1.6}.good{color:#7fe18a}.warn{color:#ffd36b}@media(max-width:700px){.grid{grid-template-columns:1fr}.footBtns{flex-direction:column}}</style></head><body><header><div class="sub">HISENSE C2 · VIDAA</div><h1>C2 Media Hub</h1></header><main class="grid"><button id="j" class="tile j">Jellyfin<small>Filmy i seriale →</small></button><button id="x" class="tile x">Xbox Cloud<small>Graj online →</small></button></main><footer><div class="footBtns"><button id="s" class="set">Ustaw Jellyfin</button><button id="test" class="set">Test połączenia</button></div><span>Strzałki · OK</span></footer><div id="o" class="overlay"><div class="dialog"><h2>Adres serwera Jellyfin</h2><p>Przykład: 192.168.1.20:8096</p><input id="u" inputmode="url" autocomplete="off"><div class="actions"><button id="c">Anuluj</button><button id="v" class="save">Zapisz</button></div></div></div><div id="diag" class="overlay"><div class="dialog"><h2>Test połączenia</h2><div id="res" class="result">Naciśnij „Uruchom test”.</div><p>Najlepsza zgodność: H.264 + AAC. Materiały AV1, DTS i napisy graficzne mogą wymagać transkodowania przez serwer Jellyfin.</p><div class="actions"><button id="dc">Zamknij</button><button id="go" class="save">Uruchom test</button></div></div></div><script>var def="https://jellyfin.bartstream.app",key="c2-jellyfin-url",o=document.getElementById("o"),d=document.getElementById("diag"),u=document.getElementById("u"),j=document.getElementById("j"),res=document.getElementById("res");function show(){u.value=localStorage.getItem(key)||def;o.className="overlay open";setTimeout(function(){u.focus()},0)}function close(){o.className="overlay";j.focus()}function save(){var v=u.value.trim();if(v&&!/^https?:\/\//i.test(v))v="http://"+v;if(v){localStorage.setItem(key,v);close()}}function result(m,c){res.className="result "+(c||"");res.innerHTML=m}function speed(){result("Trwa pomiar…","");var start=Date.now(),x=new XMLHttpRequest();x.open("GET","https://speed.cloudflare.com/__down?bytes=1000000&t="+start,true);x.responseType="arraybuffer";x.timeout=15000;x.onload=function(){var sec=(Date.now()-start)/1000,mbps=(8/sec).toFixed(1),q=mbps>=35?"4K":mbps>=10?"1080p":mbps>=5?"720p":"niska jakość";var cls=mbps>=10?"good":"warn",jf=localStorage.getItem(key)||def;result("Internet: <b>"+mbps+" Mb/s</b><br>Rekomendacja: <b>"+q+"</b><br>Jellyfin: "+(jf?jf:"adres nieustawiony"),cls)};x.onerror=x.ontimeout=function(){result("Test internetu nie powiódł się. Sprawdź Wi‑Fi/Ethernet. Jellyfin w sieci lokalnej nadal może działać.","warn")};x.send()}j.onclick=function(){var v=localStorage.getItem(key)||def;location.href=v};document.getElementById("x").onclick=function(){location.href="https://www.xbox.com/play"};document.getElementById("s").onclick=show;document.getElementById("c").onclick=close;document.getElementById("v").onclick=save;document.getElementById("test").onclick=function(){d.className="overlay open";document.getElementById("go").focus()};document.getElementById("dc").onclick=function(){d.className="overlay";j.focus()};document.getElementById("go").onclick=speed;j.focus();</script></body></html>
