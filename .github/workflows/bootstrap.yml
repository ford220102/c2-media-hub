name: Auto Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Configure native dependencies
        run: |
          printf '%s\n' \
            'allowBuilds:' \
            '  esbuild: true' \
            '  sharp: true' \
            '  workerd: true' \
            'verifyDepsBeforeRun: false' \
            > pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: c2-media-hub-build
          path: dist/
          if-no-files-found: error
